# The Modern gauntlet (docs/crucible/research/meta-gauntlet.md): one .dck per
# archetype, weighted by its share of the paper metagame. A refresh is a new
# snapshot, never an edit to this one.
format = "modern"
snapshot = "2026-11-06"
source = "MTGGoldfish paper Modern metagame, https://www.mtggoldfish.com/metagame/modern/full#paper, read 2026-11-06: the 14 archetypes at 2.5% or more (70.7% of the field together). Each list is the archetype page's featured deck, a melee.gg tournament result named in its file"
# weight: the archetype's metagame share in percent, as published; a reader
# normalises over the decks it loads.

